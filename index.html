<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picard's Eggtimer</title>
    <style>
        :root {
            --lcars-bg: #000000;
            --lcars-orange: #FF9C00;
            --lcars-red: #CC6666;
            --text-dark: #000000;
        }

        body {
            background-color: var(--lcars-bg);
            color: var(--lcars-orange);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Vertikaler Lautstärkeregler links */
        .volume-wrapper {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .vol-label {
            color: var(--lcars-orange);
            font-size: 0.8rem;
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        input[type=range].vertical-slider {
            -webkit-appearance: slider-vertical;
            width: 20px;
            height: 180px;
            background: var(--lcars-orange);
            outline: none;
            border-radius: 10px;
        }

        #app-container {
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 30px; /* Platz für den Regler machen */
        }

        .header {
            background-color: var(--lcars-orange);
            color: var(--text-dark);
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 5px 0;
            margin-bottom: 15px;
            border-radius: 15px;
        }

        .image-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #main-image {
            width: 220px;
            height: 220px;
            object-fit: contain;
            position: absolute;
            z-index: 1;
        }

        #progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 220px;
            height: 220px;
            z-index: 2;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: transparent;
            stroke-width: 6;
        }

        .ring-fill {
            fill: none;
            stroke: var(--lcars-orange);
            stroke-width: 6;
            stroke-linecap: butt;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
        }

        .time-display {
            font-size: 1.1rem;
            font-weight: bold;
            width: 75px;
            text-align: left;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            font-weight: bold;
            color: var(--lcars-orange);
        }

        .time-inputs select {
            background-color: var(--lcars-bg);
            color: var(--lcars-orange);
            border: 1px solid #333;
            border-radius: 3px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 2px;
            margin: 0 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .timer-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-icon {
            background-color: var(--lcars-orange);
            color: var(--text-dark);
            border: none;
            border-radius: 3px;
            font-size: 0.9rem;
            font-weight: bold;
            width: 28px;
            height: 25px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-icon.stop {
            background-color: var(--lcars-red);
        }

        .btn-icon:active {
            opacity: 0.7;
        }

        .bottom-buttons {
            width: 100%;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-main, .btn-secondary {
            border: none;
            border-radius: 3px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 8px;
            cursor: pointer;
        }

        .btn-main {
            background-color: var(--lcars-red);
            color: white;
        }

        .btn-secondary {
            background-color: var(--lcars-orange);
            color: var(--text-dark);
        }

        .btn-main:active, .btn-secondary:active {
            opacity: 0.7;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

<!-- Vertikaler Lautstärkeregler -->
<div class="volume-wrapper">
    <input type="range" id="volume-slider" class="vertical-slider" min="0" max="1" step="0.05" value="1" orient="vertical">
    <div class="vol-label">VOL</div>
</div>

<div id="app-container">
    <div class="header">Picard's Eggtimer</div>

    <div class="image-container">
        <img id="main-image" src="starfleet.png" alt="Starfleet">
        <svg id="progress-ring" viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="105"></circle>
            <circle id="ring-circle" class="ring-fill" cx="110" cy="110" r="105"></circle>
        </svg>
    </div>

    <!-- Timer 1 -->
    <div class="timer-row" id="timer-1">
        <div class="time-display">00:00:00</div>
        <div class="time-inputs">
            <select class="input-h"><option value="0">0</option></select>:
            <select class="input-m"><option value="0">00</option></select>:
            <select class="input-s"><option value="0">00</option></select>
        </div>
        <div class="timer-buttons">
            <button class="btn-icon stop" onclick="timer1.stop()">■</button>
            <button class="btn-icon" onclick="timer1.start()">▶</button>
        </div>
    </div>

    <!-- Timer 2 -->
    <div class="timer-row" id="timer-2">
        <div class="time-display">00:00:00</div>
        <div class="time-inputs">
            <select class="input-h"><option value="0">0</option></select>:
            <select class="input-m"><option value="0">00</option></select>:
            <select class="input-s"><option value="0">00</option></select>
        </div>
        <div class="timer-buttons">
            <button class="btn-icon stop" onclick="timer2.stop()">■</button>
            <button class="btn-icon" onclick="timer2.start()">▶</button>
        </div>
    </div>

    <!-- Timer 3 -->
    <div class="timer-row" id="timer-3">
        <div class="time-display">00:00:00</div>
        <div class="time-inputs">
            <select class="input-h"><option value="0">0</option></select>:
            <select class="input-m"><option value="0">00</option></select>:
            <select class="input-s"><option value="0">00</option></select>
        </div>
        <div class="timer-buttons">
            <button class="btn-icon stop" onclick="timer3.stop()">■</button>
            <button class="btn-icon" onclick="timer3.start()">▶</button>
        </div>
    </div>

    <div class="bottom-buttons">
        <button class="btn-main" onclick="engageAll()">Engage All</button>
        <button class="btn-secondary" onclick="stopAlarm()">ALARM AUS</button>
    </div>
</div>

<audio id="alarm-audio" src="engage.wav"></audio>

<script>
    // --- Lautstärkeregler Logik ---
    const audioElement = document.getElementById('alarm-audio');
    const volumeSlider = document.getElementById('volume-slider');
    
    // Setzt die Start-Lautstärke auf 100% (vom Android-Gerätelimit)
    audioElement.volume = volumeSlider.value;
    
    volumeSlider.addEventListener('input', (e) => {
        audioElement.volume = e.target.value;
    });

    // WICHTIG: Die App kann die Lautstärke nur relativ zur Android-Systemlautstärke ändern.
    // Wenn das Tablet auf "Leise" gestellt ist, ist 100% im Regler immer noch leise.

    // --- Setup der Dropdowns ---
    function populateDropdowns() {
        const selectsH = document.querySelectorAll('.input-h');
        const selectsM = document.querySelectorAll('.input-m');
        const selectsS = document.querySelectorAll('.input-s');

        for (let i = 1; i <= 60; i++) {
            selectsH.forEach(sel => { let opt = document.createElement('option'); opt.value = i; opt.text = i; sel.add(opt); });
        }
        for (let i = 1; i < 60; i++) {
            let displayVal = i.toString().padStart(2, '0');
            selectsM.forEach(sel => { let opt = document.createElement('option'); opt.value = i; opt.text = displayVal; sel.add(opt); });
            selectsS.forEach(sel => { let opt = document.createElement('option'); opt.value = i; opt.text = displayVal; sel.add(opt); });
        }
    }
    populateDropdowns();
    document.querySelectorAll('.input-m').forEach(sel => sel.value = "5");

    // --- Timer Klasse ---
    class Timer {
        constructor(rowId) {
            this.row = document.getElementById(rowId);
            this.display = this.row.querySelector('.time-display');
            this.selH = this.row.querySelector('.input-h');
            this.selM = this.row.querySelector('.input-m');
            this.selS = this.row.querySelector('.input-s');
            
            this.remaining = 0;
            this.total = 0;
            this.interval = null;
            this.isAlarming = false;

            this.selH.addEventListener('change', () => this.updateTimeFromInputs());
            this.selM.addEventListener('change', () => this.updateTimeFromInputs());
            this.selS.addEventListener('change', () => this.updateTimeFromInputs());
            this.updateTimeFromInputs();
        }

        updateTimeFromInputs() {
            if (this.interval || this.isAlarming) return;
            let h = parseInt(this.selH.value) || 0;
            let m = parseInt(this.selM.value) || 0;
            let s = parseInt(this.selS.value) || 0;
            this.total = h * 3600 + m * 60 + s;
            this.remaining = this.total;
            this.display.textContent = this.formatTime(this.remaining);
        }

        formatTime(secs) {
            let h = Math.floor(secs / 3600);
            let m = Math.floor((secs % 3600) / 60);
            let s = secs % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        start() {
            if (this.interval || this.isAlarming) return;
            this.updateTimeFromInputs();
            if (this.remaining <= 0) return;

            this.interval = setInterval(() => {
                this.remaining--;
                this.display.textContent = this.formatTime(this.remaining);
                updateRing(this.remaining / this.total);
                
                if (this.remaining <= 0) {
                    this.stop();
                    this.isAlarming = true;
                    this.display.style.color = "var(--lcars-red)";
                    triggerAlarm();
                }
            }, 1000);
        }

        stop() {
            if (this.interval) {
                clearInterval(this.interval);
                this.interval = null;
            }
            if (this.isAlarming) {
                this.isAlarming = false;
                this.display.style.color = "var(--lcars-orange)";
            }
            this.updateTimeFromInputs();
            if (!timer1.interval && !timer2.interval && !timer3.interval) {
                updateRing(1);
            }
        }
    }

    // --- Ring Update ---
    const ringCircle = document.getElementById('ring-circle');
    const ringRadius = 105;
    const ringCircumference = 2 * Math.PI * ringRadius;
    ringCircle.style.strokeDasharray = ringCircumference;
    
    function updateRing(fraction) {
        const offset = ringCircumference - (fraction * ringCircumference);
        ringCircle.style.strokeDashoffset = offset;
    }
    updateRing(1);

    // --- Timer Instanzen ---
    const timer1 = new Timer('timer-1');
    const timer2 = new Timer('timer-2');
    const timer3 = new Timer('timer-3');

    function engageAll() {
        stopAlarm();
        timer1.start();
        timer2.start();
        timer3.start();
    }

    // --- Alarm Logik (12x Loop) ---
    const mainImage = document.getElementById('main-image');
    let alarmInterval = null;
    let alarmCount = 0;

    function triggerAlarm() {
        if (alarmInterval) return;

        mainImage.src = "picard.gif";
        alarmCount = 0;

        const playSound = () => {
            // Jetzt klingelt er 12 Mal
            if (alarmCount >= 12) {
                stopAlarm();
                return;
            }
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log("Audio play failed:", e));
            
            audioElement.onended = () => {
                alarmCount++;
                if (alarmCount < 12) {
                    setTimeout(playSound, 500); 
                } else {
                    stopAlarm();
                }
            };
            
            // Fallback
            setTimeout(() => {
                if (alarmCount < 12) {
                    alarmCount++;
                    if (alarmCount < 12) {
                        setTimeout(playSound, 500);
                    } else {
                        stopAlarm();
                    }
                }
            }, 5000); 
        };

        playSound();
    }

    function stopAlarm() {
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
        audioElement.pause();
        audioElement.currentTime = 0;
        mainImage.src = "starfleet.png"; 
        
        timer1.stop();
        timer2.stop();
        timer3.stop();
    }
</script>

</body>
</html>
